<svg viewBox="0 0 590 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f8f6b"/>
      <stop offset="55%" stop-color="#1a2340"/>
      <stop offset="100%" stop-color="#18224b"/>
    </linearGradient>
    <linearGradient id="pinPP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a900"/>
    </linearGradient>
    <linearGradient id="roofPP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8fb3"/>
      <stop offset="100%" stop-color="#8ef"/>
    </linearGradient>
  </defs>

  <rect width="590" height="200" fill="url(#bgPP)"/>

  <line x1="20" y1="165" x2="570" y2="165" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <g transform="translate(45,118)">
    <rect x="0" y="0" width="105" height="62" rx="12" fill="#0b1020" stroke="rgba(255,255,255,0.2)"/>
    <rect x="15" y="38" width="11" height="17" fill="#6ee7b7"/>
    <rect x="34" y="24" width="11" height="31" fill="#8ef"/>
    <rect x="53" y="12" width="11" height="43" fill="#ffd166"/>
    <rect x="72" y="28" width="11" height="27" fill="#8ef"/>
    <rect x="91" y="18" width="11" height="37" fill="#6ee7b7"/>
  </g>

  <g transform="translate(215,25)">
    <polygon points="80,0 0,66 160,66" fill="url(#roofPP)"/>
    <rect x="14" y="66" width="132" height="94" fill="#f6f7fb"/>
    <rect x="34" y="88" width="32" height="32" fill="#22305c"/>
    <rect x="94" y="88" width="32" height="32" fill="#22305c"/>
    <rect x="64" y="128" width="32" height="32" fill="#0b1020"/>
    <rect x="74" y="138" width="8" height="8" fill="#ffd166"/>
  </g>

  <g transform="translate(452,112)">
    <!-- coin edge (thickness/side of the disc) -->
    <path d="M4,34 L4,41 A36,22 0 0 0 76,41 L76,34 A36,22 0 0 1 4,34 Z" fill="#a8720a"/>
    <g stroke="#8a5c06" stroke-width="1.6" opacity="0.8">
      <line x1="10" y1="37" x2="10" y2="42"/>
      <line x1="17" y1="41.5" x2="17" y2="46.5"/>
      <line x1="24.5" y1="44.5" x2="24.5" y2="49.5"/>
      <line x1="32.5" y1="46.3" x2="32.5" y2="51.3"/>
      <line x1="40" y1="46.8" x2="40" y2="51.8"/>
      <line x1="47.5" y1="46.3" x2="47.5" y2="51.3"/>
      <line x1="55.5" y1="44.5" x2="55.5" y2="49.5"/>
      <line x1="63" y1="41.5" x2="63" y2="46.5"/>
      <line x1="70" y1="37" x2="70" y2="42"/>
    </g>
    <!-- coin face (top ellipse, tilted view) -->
    <ellipse cx="40" cy="34" rx="36" ry="22" fill="url(#pinPP)"/>
    <ellipse cx="40" cy="34" rx="36" ry="22" fill="none" stroke="#a8720a" stroke-width="1.5"/>
    <ellipse cx="40" cy="34" rx="28" ry="16" fill="none" stroke="#fff2c4" stroke-width="1.3" opacity="0.55"/>
    <!-- glossy highlight -->
    <path d="M14,24 Q34,12 62,20 Q38,17 18,30 Z" fill="#ffffff" opacity="0.35"/>
    <text x="40" y="42" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#8a5a00" text-anchor="middle">₹</text>
  </g>
</svg>
