<svg viewBox="0 0 590 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="55%" stop-color="#2a1f5c"/>
      <stop offset="100%" stop-color="#18224b"/>
    </linearGradient>
    <linearGradient id="screenSC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2360"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="bubbleSC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fb3"/>
      <stop offset="100%" stop-color="#6aa3ff"/>
    </linearGradient>
    <linearGradient id="goldSC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2b8"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c8890a"/>
    </linearGradient>
  </defs>

  <rect width="590" height="200" fill="url(#bgSC)"/>

  <g transform="translate(228,6)">
    <rect x="0" y="0" width="134" height="188" rx="20" fill="#f6f7fb" opacity="0.95"/>
    <rect x="9" y="18" width="116" height="146" rx="6" fill="url(#screenSC)"/>
    <circle cx="67" cy="176" r="8" fill="#0b1020"/>

    <circle cx="67" cy="60" r="31" fill="url(#bubbleSC)"/>
    <text x="67" y="73" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#0b1020" text-anchor="middle">?</text>

    <rect x="20" y="102" width="94" height="16" rx="7" fill="#6ee7b7"/>
    <rect x="20" y="123" width="94" height="16" rx="7" fill="rgba(255,255,255,0.25)"/>
    <rect x="20" y="144" width="94" height="16" rx="7" fill="rgba(255,255,255,0.25)"/>
  </g>

  <g transform="translate(65,55)">
    <circle cx="45" cy="45" r="42" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8"/>
    <circle cx="45" cy="45" r="42" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="200 264" stroke-linecap="round" transform="rotate(-90 45 45)"/>
    <line x1="45" y1="45" x2="45" y2="16" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="45" x2="67" y2="52" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(431,60)">
    <!-- handles -->
    <path d="M13,10 c-11,0 -11,20 0,22" fill="none" stroke="url(#goldSC)" stroke-width="5" stroke-linecap="round"/>
    <path d="M55,10 c11,0 11,20 0,22" fill="none" stroke="url(#goldSC)" stroke-width="5" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M13,8 h42 v20 a21,21 0 0 1 -42,0 z" fill="url(#goldSC)"/>
    <circle cx="34" cy="16" r="10" fill="#fff2b8" opacity="0.35"/>
    <!-- stem -->
    <path d="M28,49 h12 v10 h-12 z" fill="url(#goldSC)"/>
    <!-- base -->
    <rect x="16" y="59" width="36" height="7" rx="2.5" fill="url(#goldSC)"/>
    <rect x="21" y="66" width="26" height="6" rx="2.5" fill="url(#goldSC)"/>
  </g>
